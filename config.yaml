# UN sanctions OSINT monitor — configuration
# Everything here is optional to change; the defaults run the full sweep.

lookback_days: 7            # window searched each run (matches the weekly schedule)
max_catchup_days: 30        # a party missed last run is searched back to its last search (up to this)
max_sweep_minutes: 270      # time budget; parties not reached are searched FIRST next run, no gap

list:
  url: https://scsanctions.un.org/resources/xml/en/consolidated.xml
  # Limit the OSINT sweep to some regimes (UN_LIST_TYPE values, see data/un_consolidated_list.csv,
  # e.g. DRC, DPRK, Al-Qaida, Libya...). Empty = monitor everyone. List changes are always tracked.
  regimes: []

sources:
  gdelt:
    # Bulk mode: every 15-minute GDELT knowledge-graph file since the last run (all news GDELT
    # monitors worldwide, English + machine-translated from 65+ languages) is downloaded and matched
    # against every name, alias and context-qualified nickname. No rate limits, no per-name quota.
    bulk: true
    streams: [english, translated]
    # Per-name DOC API search. GDELT heavily rate-limits GitHub's servers, so it is off by default.
    doc_api: false
    max_records: 250
    delay_seconds: 5.5
  google_news:
    enabled: true
    delay_seconds: 4.0        # Google blocks fast clients; on a block the run pauses 15 min, then
                              # stops Google News and carries the remaining parties to next run
    # Plain names in English are already covered by the GDELT bulk feed; by default Google News is
    # used for local-language editions, nicknames-with-context and document numbers.
    english_names: false
    include_original_script: true   # also search Arabic/Korean/etc. spellings from the UN list
    editions:                 # searched for every party
      - {hl: en-US, gl: US, ceid: "US:en"}
    # Added automatically for a party whose nationality/address matches one of the countries.
    local_editions:
      french:
        {hl: fr, gl: FR, ceid: "FR:fr", countries: [Congo, Central African Republic, Mali, Haiti, Rwanda,
         Burundi, "Côte d'Ivoire", Niger, Burkina Faso, Chad, Cameroon, Senegal, Guinea, Togo, Benin,
         Gabon, Madagascar, Lebanon, Algeria, Tunisia, Morocco, Mauritania, France, Belgium, Djibouti, Comoros]}
      arabic:
        {hl: ar, gl: EG, ceid: "EG:ar", countries: [Iraq, Syria, Syrian Arab Republic, Yemen, Libya, Sudan,
         Somalia, Saudi Arabia, Kuwait, Jordan, Egypt, Lebanon, Qatar, United Arab Emirates, Bahrain, Oman,
         Algeria, Tunisia, Morocco, Mauritania, Palestine, Djibouti, Comoros]}
      korean:
        {hl: ko, gl: KR, ceid: "KR:ko", countries: [Korea, North Korea, South Korea]}
      russian:
        {hl: ru, gl: RU, ceid: "RU:ru", countries: [Russian Federation, Russia, Ukraine, Kazakhstan,
         Uzbekistan, Tajikistan, Kyrgyzstan, Belarus, Azerbaijan, Georgia, Turkmenistan]}
      turkish:
        {hl: tr, gl: TR, ceid: "TR:tr", countries: [Turkey, Türkiye]}
      indonesian:
        {hl: id, gl: ID, ceid: "ID:id", countries: [Indonesia, Malaysia]}
      chinese:
        {hl: zh-Hans, gl: CN, ceid: "CN:zh-Hans", countries: [China]}
      portuguese:
        {hl: pt-BR, gl: BR, ceid: "BR:pt-419", countries: [Mozambique, Angola, Brazil, Guinea-Bissau]}
      spanish:
        {hl: es-419, gl: MX, ceid: "MX:es-419", countries: [Colombia, Venezuela, Mexico, Spain, Peru,
         Ecuador, Bolivia, Argentina, Chile]}

  # RSS/Atom feeds whose every new item is scanned for ANY listed name.
  feeds: []   # (the UN SC list-update RSS blocks automated clients; list changes come from the XML)
  # Google News searches turned into feeds and scanned the same way.
  topic_queries:
    - '"Security Council" sanctions committee'
    - '"Panel of Experts" report'
    - 'OFAC designates'
    - '"sanctions evasion"'
    - 'Interpol "UN Security Council Special Notice"'
    - '"Security Council" committee amends sanctions list entry'
    - '"State Department" designates terrorist'
    - '"Rewards for Justice"'

  # Listing pages of UN sanctions reports. Each NEW report (PDF) is downloaded and its full text
  # scanned for every listed name. First run only records existing reports as a baseline.
  reports:
    enabled: true
    max_new_reports_per_run: 100   # scanned PDFs are OCR'd automatically
    # Each committee's report listing; the UN site uses different path styles, all are tried.
    committees: [1267, 1988, 1533, 1591, 1718, 1970, 2127, 2140, 2206, 2653, 2713, 2745]
    committee_base: "https://main.un.org/securitycouncil/en/sanctions/{n}/"
    page_variants:
      - panel-of-experts/expert-reports
      - panel-of-experts/work-and-mandate/reports
      - PoE/Reports
      - work-and-mandate/reports
      - panel_experts/reports
      - panel-of-experts/reports
      - panel-experts/reports
      - monitoring-team/reports
      - monitoring_team/reports
      - reports
    pages:
      - https://www.securitycouncilreport.org/un_documents_type/sanctions-committee-documents/

  # Official releases: every NEW item is read in full and checked for every listed name.
  # First run reads the latest `first_run_items` per source and records the rest as history.
  official:
    enabled: true
    first_run_items: 15
    max_pages_per_run: 400
    sources:
      # UN sanctions committee press releases (press.un.org) refuse automated readers; the same
      # additions, amendments and removals are taken directly from the official UN list XML.
      - name: US Treasury press releases
        url: https://home.treasury.gov/news/press-releases
        link_pattern: '/news/press-releases/[a-z]{2}\d{3,5}/?$'
      - name: US OFAC recent actions
        url: https://ofac.treasury.gov/recent-actions
        link_pattern: '/recent-actions/\d{8}'
      - name: US Justice Department press releases
        url: https://www.justice.gov/news/rss?type=press_release&m=1
      # (The DOJ National Security Division page and state.gov refuse automated readers; NSD
      #  releases are in the DOJ feed above, State designations are also published by Treasury/OFAC
      #  and are picked up by the Google News topic query below.)
      - name: FBI press releases
        url: https://www.fbi.gov/news/press-releases
        link_pattern: '/news/press-releases/[^/]+$|/field-offices/[^/]+/news/[^/]+$'
      - name: UK Office of Financial Sanctions Implementation
        url: https://www.gov.uk/search/all.atom?organisations%5B%5D=office-of-financial-sanctions-implementation&order=updated-newest

  # Flags when a UN-listed party is newly added to another authority's list (OFAC, EU, UK, etc.).
  # NOTE: OpenSanctions data is free for non-commercial use only (CC BY-NC 4.0);
  # commercial users need a licence from opensanctions.org or should set enabled: false.
  opensanctions:
    enabled: true
    url: https://data.opensanctions.org/datasets/latest/sanctions/targets.simple.csv

# Context gate applied to ALL news sources (GDELT, Google News, topic feeds). A name match only
# counts if the article carries a security/sanctions topic. Official UN/US/UK releases, UN reports
# and document-number matches are high-signal and are not gated.
relevance:
  enabled: true
  # GDELT's own topic codes (assigned in every language it reads); matched as substrings,
  # e.g. TERROR also covers TAX_TERROROGROUP_*, SANCTION covers SANCTIONS.
  gdelt_themes: [TERROR, SANCTION, ARMEDCONFLICT, MILITANCY, MILITANT, INSURGEN, REBEL, EXTREMIS,
                 RADICAL, JIHAD, WMD, WEAPON, ARMS_, SUICIDE_ATTACK, KIDNAP, SMUGGL, TRAFFICK, LAUNDER,
                 MONEY_LAUNDERING, SEIGE, SECURITY_SERVICES, ARREST, KILL, TRIAL, EXTRADIT, PROLIFERAT,
                 NUCLEAR, MISSILE, ASSASSINAT, FUGITIVE, WANTED, CONFLICT_AND_VIOLENCE, ORGANIZED_CRIME,
                 CRIME_ILLICIT, BLACK_MARKET, PIRACY, HOSTAGE, MILITARY]
  # Matched at word starts (so "terror" also matches terrorist, terrorisme, terrorista…).
  keywords:
    en: [terror, designat, sanction, jihad, mujahid, militant, militia, insurgen, extremis, radicali,
         rebel, armed group, attack, bombing, bomb, explosive, suicide, killed, killing, kill, assassinat,
         kidnap, hostage, arrest, detain, captured, extradit, indict, charged, convict, sentenced,
         trial, prosecut, wanted, fugitive, bounty, reward, financ, launder, smuggl, traffick, arms,
         weapon, missile, nuclear, proliferat, evasion, evade, asset freeze, travel ban, blacklist,
         interpol, security council, panel of experts, ofac, treasury, al qaeda, al qaida, isis, isil,
         daesh, islamic state, taliban, shabaab, houthi, ansarallah, hezbollah, hamas, boko haram,
         jnim, lashkar, jaish, haqqani, ttp, m23, fdlr, adf]
    fr: [terroris, djihad, jihad, milice, rebell, insurg, attaque, attentat, explosif, enlev, otage,
         arrete, arrestation, interpell, condamn, inculp, proces, poursuiv, recherche, financement,
         blanchiment, trafic, contrebande, groupe arme, conseil de securite, gel des avoirs]
    ar: [إرهاب, ارهاب, إرهابي, عقوبات, جهاد, مسلح, ميليشيا, هجوم, تفجير, اغتيال, اختطاف, اعتقال,
         القبض, محكمة, حكم, تمويل, غسل, تهريب, سلاح, صاروخ, مجلس الأمن, داعش, القاعدة, الشباب,
         الحوثي, طالبان]
    ru: [террор, санкц, джихад, боевик, теракт, вооружен, нападен, взрыв, похищ, арест, задерж,
         убит, ликвидир, суд, приговор, финансир, отмыван, контрабанд, оружи, ракет, розыск]
    ko: [제재, 테러, 미사일, 핵, 무기, 체포, 기소, 정찰총국, 해킹, 자금세탁, 밀수]
    es: [terroris, sancion, yihad, milicia, insurg, ataque, atentado, secuestr, arrest, detenid,
         captur, extradi, conden, juicio, acusad, armas, lavado, contraband, narcotrafic]
    pt: [terroris, sancao, sancoes, jihad, milicia, insurg, ataque, atentado, sequestr, preso,
         presos, detid, conden, julgamento, armas, lavagem, contraband]
    tr: [teror, yaptirim, cihat, silahli, militan, saldiri, bombal, gozalti, tutuklan, yakalan,
         mahkeme, finans, kacakcilik, silah]
    id: [teror, sanksi, jihad, militan, ekstremis, serangan, bom, ditangkap, densus, pengadilan,
         vonis, pendanaan, senjata]
    zh: [恐怖, 制裁, 圣战, 武装, 袭击, 爆炸, 逮捕, 拘留, 法院, 判刑, 洗钱, 走私, 武器, 导弹]
  prominence:
    # For a party with more than this many relevant items in a run (e.g. Al-Qaida, the Houthis),
    # keep only items naming it in the headline or within the first N characters of the article.
    applies_above_items: 15
    within_chars: 1500

matching:
  # Every good-quality alias is searched (spread over as many queries as needed).
  # Nicknames / low-quality aliases are searched together with the party's organisation acronyms
  # and countries (e.g. "Tiger One" AND (M23 OR Congo)). Passport/ID and IMO numbers are searched too.
  min_name_length: 8          # shorter plain names are searched only as nicknames-with-context
  max_names_per_query: 4      # name variants OR-ed into one query

fetch:
  max_page_fetches: 3000      # article pages read to extract the sentence naming the party
  workers: 16

scoring:
  use_llm: true               # used only if the ANTHROPIC_API_KEY secret is set
  model: claude-haiku-4-5-20251001
  threshold: 0.6              # minimum confidence for an item to be alerted
  near_miss_floor: 0.3        # items between this and threshold are listed as "borderline"
  near_misses_trigger_alert: true   # send the report even if only borderline items were found
  max_hits_per_entity: 100    # new items reviewed per party per run (excess is reported, not hidden)
  workers: 4

health_failure_ratio: 0.5     # alert if a source fails on >= 50% of requests (coverage gap)
circuit_breaker_failures: 15  # switch a source off for the run after this many failures in a row

# History database and review (see README "Reviewing findings").
history:
  enabled: true
  baseline_days: 90                 # look-back of the one-off baseline status run
  baseline_top_per_individual: 5    # strongest findings per person put on the baseline checklist
  baseline_top_per_entity: 3        # per organisation (the rest stay searchable on the dashboard)
  baseline_prominence_above: 40     # 90 days of coverage: allow more items before requiring headline mentions
